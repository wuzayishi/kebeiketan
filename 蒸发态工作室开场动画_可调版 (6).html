function metrics(){
  const B=100, maxW=W*0.86, w=CFG.weight;
  const ref=TXT.map(function(text,i){
    const L=CFG.lines[i];
    mctx.font=w+' '+(B*L.k)+'px '+FONT;
    const tk=tokens(text),hd=IMG.head?B*L.k*CFG.headSize*1.6:0;
    let v=0;for(const t of tk)v+=t.head?hd:mctx.measureText(t.ch).width;
    return v+(B*L.k*L.sp)*(tk.length-1);
  });
  let size=clamp(Math.min(W*0.118,H*0.13),30,130)*CFG.sizeScale*((CFG.captionSize||100)/100);
  for(let i=0;i<ref.length;i++) if(ref[i]*size/B>maxW) size=Math.min(size,maxW*B/ref[i]);
  size=Math.max(12,size);
  const hs=CFG.lines.map((L,i)=>{
    const base=size*L.k*CFG.lineGap;
    const hd=(IMG.head&&TXT[i]&&TXT[i].indexOf('/head')>=0)?size*L.k*CFG.headSize*1.6:0;
    return Math.max(base,hd*1.06);

  let acc=-hs.reduce((a,b)=>a+b,0)/2;

function sample(text,o){
  const oc=document.createElement('canvas');oc.width=W;oc.height=H;
  const g=oc.getContext('2d');
  g.font=o.font;g.textAlign='center';g.textBaseline='middle';g.fillStyle='#fff';
  const tk=tokens(text),hd=o.headD||0,heads=[];
  const ws=tk.map(t=>t.head?hd:g.measureText(t.ch).width);
  let total=0;for(const v of ws)total+=v;
  total+=o.spacing*(tk.length-1);
  let x=(W-total)/2;const boxes=[];
  tk.forEach((t,i)=>{
    if(t.head){if(hd>0)heads.push({cx:x+hd/2,cy:o.y,d:hd});}
    else if(t.ch.trim()!==''){g.fillText(t.ch,x+ws[i]/2,o.y);boxes.push({x0:x,x1:x+ws[i],ci:i});}
    x+=ws[i]+o.spacing;
  });
  const data=g.getImageData(0,0,W,H).data;
  const buckets=new Map();
  for(let py=0;py<H;py++)for(let px=0;px<W;px++){
    if(data[(py*W+px)*4+3]>52){
      let ci=tk.length-1;
      for(let k=0;k<boxes.length;k++)if(px>=boxes[k].x0-2&&px<=boxes[k].x1+2){ci=boxes[k].ci;break;}
      if(!buckets.has(ci))buckets.set(ci,[]);
      buckets.get(ci).push(px,py,ci);
    }
  }
  const pts=[],cg=o.charGaps||{},gl=o.gap||1;
  buckets.forEach((arr,ci)=>{
    const c=clamp(cg[ci]===undefined?1:cg[ci],0.25,3);
    const keep=clamp(1/(CFG.particleGap*gl*c),0,1);
    for(let i=0;i<arr.length;i+=3)if(Math.random()<keep)pts.push(arr[i],arr[i+1],arr[i+2]);
  });
  let m=pts.length/3;
  if(m>CFG.maxParticles){
    const drop=(m-CFG.maxParticles)/m,out=[];
    for(let i=0;i<m;i++){if(Math.random()<drop)continue;out.push(pts[i*3],pts[i*3+1],pts[i*3+2]);}
    return {arr:out,count:out.length/3,chars:tk.length,heads};
  }
  return {arr:pts,count:m,chars:tk.length,heads};
}

function colorCard(key,label){
  const box=document.createElement('div');box.className='op-color';
  const head=document.createElement('div');head.className='chead';
  const sw=document.createElement('label');sw.className='op-swatch';
  const pick=document.createElement('input');pick.type='color';pick.setAttribute('aria-label',label);
  sw.appendChild(pick);
  const b=document.createElement('b');b.textContent=label;
  const hex=document.createElement('input');hex.className='op-txt op-hex';hex.spellcheck=false;
  head.appendChild(sw);head.appendChild(b);head.appendChild(hex);box.appendChild(head);
  const R={},N={};
  [['H','色相',0,360,1],['S','饱和度',0,100,1],['L','亮度',0,100,1]].forEach(function(sp){
    const r=document.createElement('div');r.className='op-row color-hsl';
    r.innerHTML='<span>'+sp[1]+'</span><input type="range" min="'+sp[2]+'" max="'+sp[3]+'" step="'+sp[4]+'">'+
      '<input type="number" min="'+sp[2]+'" max="'+sp[3]+'" step="'+sp[4]+'">';
    R[sp[0]]=r.children[1];N[sp[0]]=r.children[2];
    if(sp[0]==='H')R.H.classList.add('hue');
    box.appendChild(r);
  });
  function paint(h,s,l,hx,keepHex,silent){
    cfg[key]=hx;
    if(!keepHex)hex.value=hx;
    sw.style.background=hx;pick.value=hx;
    R.H.value=Math.round(h);N.H.value=Math.round(h);
    R.S.value=Math.round(s);N.S.value=Math.round(s);
    R.L.value=Math.round(l);N.L.value=Math.round(l);
    R.S.style.background='linear-gradient(to right,hsl('+h+',0%,50%),hsl('+h+',100%,50%))';
    R.L.style.background='linear-gradient(to right,hsl('+h+',100%,0%),hsl('+h+',100%,50%),hsl('+h+',100%,100%))';
    if(!silent)changed();
  }
  function fromHex(v,keepHex){
    const rgb=hx2rgb(v);if(!rgb)return false;
    const hsl=rgb2hsl(rgb);
    paint(hsl[0],hsl[1],hsl[2],rgb2hx(rgb),keepHex);
    return true;
  }
  function fromHSL(){
    const h=parseFloat(R.H.value)||0,s=parseFloat(R.S.value)||0,l=parseFloat(R.L.value)||0;
    paint(h,s,l,hsl2hx(h,s,l),false);
  }
  hex.addEventListener('input',function(){fromHex(hex.value,true);});
  hex.addEventListener('change',function(){if(!fromHex(hex.value,false))hex.value=cfg[key];});
  pick.addEventListener('input',function(){fromHex(pick.value,false);});
  pick.addEventListener('change',function(){fromHex(pick.value,false);});
  ['H','S','L'].forEach(function(k){
    R[k].addEventListener('input',function(){N[k].value=R[k].value;fromHSL();});
    N[k].addEventListener('input',function(){
      let v=parseFloat(N[k].value);if(isNaN(v))return;
      v=Math.min(parseFloat(R[k].max),Math.max(parseFloat(R[k].min),v));
      R[k].value=v;fromHSL();
    });
  });
  const rgb=hx2rgb(cfg[key])||[5,7,10],hsl=rgb2hsl(rgb);
  paint(hsl[0],hsl[1],hsl[2],rgb2hx(rgb),false,true);
  return box;
}

function putField(html,name,val){
  const re=new RegExp('(["\']'+name+'["\']\\s*:\\s*["\'])([^"\']*)(["\'])');
  return re.test(html)?html.replace(re,function(m,a,b,c){return a+val+c;}):html;
}
function injectHTML(){
  const box=$('#op-inject-src');if(!box)return;
  let html=box.value||injectSrc;
  if(!html.trim()){status('先粘贴 AI 生成的 HTML');return;}
  const st=html.search(/<!DOCTYPE html>/i);if(st>0)html=html.slice(st);
  const en=html.lastIndexOf('</html>');if(en>=0)html=html.slice(0,en+7);
  let n=0;
  if(cfg.bgImage&&html.indexOf(PH_BG)>=0){html=html.split(PH_BG).join(cfg.bgImage);n++;}
  if(cfg.headImage&&html.indexOf(PH_HD)>=0){html=html.split(PH_HD).join(cfg.headImage);n++;}
  html=putField(html,'bgImage',cfg.bgImage||'');
  html=putField(html,'headImage',cfg.headImage||'');
  html=putField(html,'bgSig',cfg.bgSig||'');
  html=putField(html,'headSig',cfg.headSig||'');
  const anchor=/window\.OPENER_CONFIG\s*=\s*\{/.exec(html);
  const missing=[];
  [['bgImage','bgSig'],['headImage','headSig']].forEach(function(a){
    const v=cfg[a[0]]||'';if(!v)return;
    if(html.indexOf(v)<0&&anchor)missing.push(JSON.stringify(a[0])+':'+JSON.stringify(v));
    const g=cfg[a[1]]||'';
    if(g&&html.indexOf(g)<0&&anchor)missing.push(JSON.stringify(a[1])+':'+JSON.stringify(g));
  });
  if(missing.length&&anchor){
    const at=anchor.index+anchor[0].length;
    html=html.slice(0,at)+missing.join(',')+','+html.slice(at);
  }
  let bad='';
  [['bgImage','bgSig'],['headImage','headSig']].forEach(function(a){
    const v=cfg[a[0]]||'';if(!v)return;
    if(!window.Opener.cleanImage(v))bad+=' '+a[0]+'解码失败';
    else if(cfg[a[1]]&&window.Opener.sigOf(v)!==cfg[a[1]])bad+=' '+a[0]+'校验失败';
    if(html.indexOf(v)<0)bad+=' '+a[0]+'未写入';
  });
  downloadText('开场动画_已注入.html',html);
  status(bad?('异常：'+bad.trim()):('已写入 '+((cfg.bgImage?1:0)+(cfg.headImage?1:0))+' 张 · 校验通过'+(n?' · 占位符 '+n:'')));
}

document.body.appendChild(guardModal);
guardModal.addEventListener('click',function(e){
  const b=e.target.closest('[data-a]');if(!b)return;
  if(b.dataset.a==='guard-cancel'){guardModal.classList.remove('on');return;}
  if(b.dataset.a==='guard-off'){
    cfg.pixelGuard=0;guardModal.classList.remove('on');
    const cb=panel.querySelector('[data-a=pixelguard] input');if(cb)cb.checked=false;
    changed();status('像素降级保护已关闭 '+now());
  }
});
btn.addEventListener('click',function(){panel.classList.toggle('on');});
panel.addEventListener('click',function(e){
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,i=parseInt(b.dataset.i,10);
  if(a==='close'){panel.classList.remove('on');return;}
  if(a==='save'){save();return;}
  if(a==='reset'){
    cfg=clone(window.OPENER_DEFAULT);sel={};tab='html';
    try{localStorage.removeItem(KEY);}catch(err){}
    dirty=false;tab='html';
    render();window.Opener.apply(clone(cfg));status('已重置 '+now());return;
  }
  if(a==='replay'){
    window.Opener.apply(clone(cfg));clearDirty();updateInfo();
    status('已重播 '+now());panel.classList.remove('on');return;
  }
  if(a==='freeze'){
    window.Opener.freeze(window.Opener.dispAt-window.OPENER_CONFIG.hold*0.45);
    clearDirty();updateInfo();panel.classList.remove('on');return;
  }
  if(a==='add'){cfg.lines.push({text:'新的一行',k:1,sp:0.17,gap:1,charGaps:{}});render();changed();return;}
  if(a==='del'){if(cfg.lines.length<=1)return;cfg.lines.splice(i,1);delete sel[i];render();changed();return;}
  if(a==='tab-html'||a==='tab-ai'||a==='tab-inject'){
    tab=a.slice(4);
    [].forEach.call(panel.querySelectorAll('.op-tab'),function(x){x.classList.toggle('on',x.dataset.a===a);});
    refreshCode();return;
  }
  if(a==='download'){
    downloadText('开场动画.html',tab==='ai'?aiText():fullHTML());
    status('已下载 '+now());return;
  }
  if(a==='inject'){injectHTML();return;}
  if(a==='copy'){copy();return;}
  if(a==='clearchar'){if(cfg.lines[i].charGaps)delete cfg.lines[i].charGaps[sel[i]||0];render();changed();return;}
  if(a==='clearimg'){setImage(b.dataset.k,'');renderImages();changed();return;}
  if(a==='template'){
    const k=b.dataset.k,u=whiteTemplate(parseInt(b.dataset.side,10)||64);
    setImageRaw(k,u);cfg[artKeyOf(k)]=0;
    imgInfo[k]='测试模板 · 纯白';
    renderImages();renderImgInfo();changed();return;
  }
  if(a==='pixelguard'){
    const cb=b.tagName==='INPUT'?b:(b.querySelector('input')||b);
    const want=cb.checked;
    cb.checked=!!cfg.pixelGuard;
    if(want&&!cfg.pixelGuard){cfg.pixelGuard=1;cb.checked=true;changed();return;}
    if(!want&&cfg.pixelGuard){guardModal.classList.add('on');return;}
    return;
  }
  if(a==='file')return;
});
panel.addEventListener('change',function(e){
  const el=e.target,owner=el.closest('[data-a]')||el,a=owner.dataset.a,i=parseInt(owner.dataset.i,10);
  if(!a)return;
  if(a==='autosave'){cfg.autoSave=el.checked?1:0;changed();status(cfg.autoSave?'自动保存开':'自动保存关');return;}
  if(a==='text'){if(!cfg.lines[i])return;cfg.lines[i].text=el.value;sel[i]=0;renderLines();changed();return;}
  if(a==='char'){sel[i]=parseInt(el.value,10);renderLines();return;}
  if(a==='file'){
    readImage(el.files&&el.files[0],el.dataset.k,parseInt(el.dataset.side,10)||1280);
    return;
  }
  if(a==='headpos'){cfg.headPos=el.value;changed();return;}
  if(a==='keepbg'){cfg.keepBg=el.checked?1:0;changed();return;}
  if(a==='bgparticle'){cfg.bgParticle=el.checked?1:0;changed();return;}
  if(a==='headparticle'){cfg.headParticle=el.checked?1:0;changed();return;}
  if(a==='enc'){
    cfg.imageEncoding=el.value;reencodeAll(el.value);
    renderImages();renderImgInfo();changed();return;
  }
  if(a==='pixelparse'){cfg.pixelParse=el.checked?1:0;changed();return;}
});
panel.addEventListener('input',function(e){
  const el=e.target;
  if(el.id==='op-inject-src'){injectSrc=el.value;return;}
  if(el.dataset&&el.dataset.a==='text'){
    const i=parseInt(el.dataset.i,10);if(!cfg.lines[i])return;
    cfg.lines[i].text=el.value;sel[i]=0;changed();
  }
});
render();
})();
</script>
</body>
</html>
